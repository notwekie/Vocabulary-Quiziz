html { color-scheme:light; }

<script>
(function () {
  const KEY = 'kotoba-theme';
  const allowed = ['sakura','matcha','sumi'];
  const picker = document.getElementById('kotoba-theme-picker');
  function apply(value) {
    const theme = allowed.includes(value) ? value : 'sakura';
    document.body.setAttribute('data-theme', theme);
    if (picker) picker.value = theme;
    const admin = document.getElementById('theme-selector');
    if (admin) admin.value = theme;
    try { localStorage.setItem(KEY,theme); } catch (_) {}
  }
  const stored = (function(){try{return localStorage.getItem(KEY)}catch(_){return null}})();
  apply(stored);
  if (picker) picker.addEventListener('change', function(){apply(this.value)});
  window.addEventListener('storage',function(e){if(e.key===KEY)apply(e.newValue)});
  window.kotobaSetTheme = apply;
})();
</script>
