<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kotoba Exam Practice | JLPT & JFT</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#19171c;--panel:#29252c;--text:#f5f2f0;--muted:#c5bdc7;--accent:#dbad4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{background:#262129;border-bottom:3px solid #bd513d;padding:18px max(18px,calc((100vw - 980px)/2));display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}main{max-width:980px;margin:28px auto;padding:0 16px}.panel{background:var(--panel);padding:25px;border:1px solid #544a56;border-radius:15px;margin-bottom:20px}h1,h2{margin:0 0 16px}p{line-height:1.6;color:var(--muted)}button,select,input,textarea{font:inherit}button,select{border-radius:9px;padding:10px 14px;border:1px solid #a28a69;background:#a74330;color:white;cursor:pointer}button.secondary,select{background:#312b34;color:white;border-color:#6d626f}button:disabled{opacity:.45;cursor:not-allowed}label{display:block;margin:12px 0 5px;font-weight:650}input,textarea{background:#1b191e;color:white;border:1px solid #6d626f;border-radius:9px;padding:12px;width:100%}textarea{min-height:115px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:135px}.hidden{display:none!important}.passage{white-space:pre-wrap;background:#19171c;border-left:4px solid var(--accent);padding:20px;border-radius:8px;line-height:1.95;font-size:1.15rem}.choice{display:block;width:100%;text-align:left;margin:10px 0;background:#312b34;border:1px solid #6d626f}.choice.selected{outline:2px solid var(--accent)}.choice.correct{border-color:#65bb83}.choice.wrong{border-color:#f17b7b}.tag{color:var(--accent);font-weight:700}.status{min-height:24px}.note{border:1px solid #7c6946;background:#332b25;padding:12px;border-radius:9px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}a{color:#f3c86a}.small{font-size:.9rem}#feedback{margin-top:18px}#feedback p{margin:5px 0}.writing{white-space:pre-wrap;background:#1b191e;padding:12px;border-radius:8px}</style></head><body>
<header><strong>🌸 Kotoba Exam Practice</strong><div class="row"><a href="./index.html" id="backLink">← Vocabulary Home</a><select id="lang" aria-label="Explanation language"><option value="id">Bahasa Indonesia</option><option value="en">English</option></select></div></header>
<main><section class="panel" id="setup"><h1 id="heading">JLPT & JFT Practice</h1><p id="intro"></p><div><label for="studentName">Student name / Nama siswa</label><input id="studentName" maxlength="100" required placeholder="Full name / Nama lengkap"></div><div id="quizChooser"><label id="quizLabel" for="quiz">Practice set / Paket latihan</label><select id="quiz"><option value="free">All available questions / Semua soal tersedia</option><option value="n5-1">JLPT N5 — Quiz 1 (50 questions)</option></select></div><div class="row"><div><label id="levelLabel" for="level"></label><select id="level"><option>N5</option><option>N4</option><option>N3</option><option>N2</option><option>N1</option><option>JFT_A1</option><option>JFT_A2</option></select></div><div><label id="typeLabel" for="kind"></label><select id="kind"><option value="all">All skills</option><option value="grammar">Grammar</option><option value="reading">Reading</option><option value="listening">Listening</option><option value="writing">Writing</option></select></div><div><label id="modeLabel" for="mode"></label><select id="mode"><option value="study">Study mode</option><option value="exam">Exam mode</option></select></div></div><p class="note" id="audioNotice"></p><button id="start"></button><p id="setupError" role="alert"></p></section>
<section id="runner" class="panel hidden"><div class="row"><span class="tag" id="progress"></span><span id="clock" style="text-align:right"></span></div><h2 id="question" style="margin-top:20px"></h2><div id="passage" class="passage hidden"></div><div id="audio" class="hidden"><p id="audioHelp"></p><audio id="player" controls preload="none" style="width:100%"></audio><button id="tts" class="secondary hidden"></button><button id="showTranscript" class="secondary hidden"></button><div id="transcript" class="passage hidden"></div></div><div id="answers"></div><div id="feedback" class="hidden" aria-live="polite"></div><div class="actions"><button id="check"></button><button id="next" class="secondary"></button><button id="quit" class="secondary"></button></div></section>
<section id="results" class="panel hidden"><h2 id="resultTitle"></h2><p id="score"></p><p id="saveStatus" role="status"></p><button id="retrySave" class="secondary hidden">Retry save / Coba simpan lagi</button><div id="review"></div><button id="again"></button></section>
</main><script>
'use strict';
const I={id:{intro:'Latihan orisinal bergaya JLPT dan JFT-Basic; bukan soal ujian resmi. Pilih tingkat, keterampilan, dan mode.',level:'Tingkat',type:'Keterampilan',mode:'Mode',start:'Mulai latihan',all:'Semua keterampilan',grammar:'Tata bahasa',reading:'Membaca',listening:'Menyimak',writing:'Menulis',study:'Mode belajar',exam:'Mode ujian',audio:'Audio belum tersedia untuk semua soal. Dalam mode belajar, transkrip dan suara perangkat (jika tersedia) dapat digunakan. Mode ujian mengabaikan soal menyimak tanpa berkas audio.',question:'Soal',check:'Periksa jawaban',next:'Berikutnya',finish:'Selesai',quit:'Kembali',play:'Bacakan dengan suara perangkat (eksperimental)',transcript:'Tampilkan transkrip',audioHelp:'Dengarkan percakapan lalu jawab. Pemutaran suara perangkat mungkin tidak tersedia di semua perangkat.',correct:'Benar',incorrect:'Belum tepat',sample:'Contoh jawaban (bukan penilaian otomatis)',writingHint:'Tulis jawaban dalam bahasa Jepang. Latihan menulis perlu diperiksa guru; tidak dinilai otomatis.',results:'Hasil latihan',score:'Jawaban benar',ungraded:'Tugas menulis (belum dinilai)',again:'Latihan lagi',none:'Tidak ada soal untuk kombinasi ini. Coba keterampilan atau mode lain.',needAnswer:'Pilih satu jawaban terlebih dahulu.',unavailable:'Audio belum tersedia untuk soal ini. Gunakan mode belajar untuk melihat transkrip.',voiceUnavailable:'Suara Jepang tidak tersedia di perangkat ini. Gunakan transkrip atau unggah audio asli.',ready:'Siap',quizLabel:'Paket latihan',freeQuiz:'Semua soal tersedia',quizOne:'JLPT N5 — Kuis 1 (50 soal)',note:'Soal membaca yang berbagi teks ditampilkan berurutan. Jawaban diacak per sesi.'},en:{intro:'Original JLPT/JFT-Basic-style practice, not official exam questions. Choose a level, skill and mode.',level:'Level',type:'Skill',mode:'Mode',start:'Start practice',all:'All skills',grammar:'Grammar',reading:'Reading',listening:'Listening',writing:'Writing',study:'Study mode',exam:'Exam mode',audio:'Some listening questions have no audio yet. Study mode offers a transcript and optional device voice; exam mode excludes listening items without an audio file.',question:'Question',check:'Check answer',next:'Next',finish:'Finish',quit:'Back',play:'Read aloud using device voice (experimental)',transcript:'Show transcript',audioHelp:'Listen to the dialogue and answer. Device speech may not work on all devices.',correct:'Correct',incorrect:'Not quite',sample:'Sample answer (not automatically graded)',writingHint:'Write your answer in Japanese. Writing requires teacher review and is not automatically graded.',results:'Practice results',score:'Correct answers',ungraded:'Writing tasks (ungraded)',again:'Practice again',none:'No questions for this selection. Try another skill or mode.',needAnswer:'Choose an answer first.',unavailable:'Audio is unavailable for this question. Use Study mode to see the transcript.',voiceUnavailable:'Japanese speech is unavailable on this device. Use the transcript or provide a recorded audio file.',ready:'Ready',quizLabel:'Practice set',freeQuiz:'All available questions',quizOne:'JLPT N5 — Quiz 1 (50 questions)',note:'Reading questions sharing a passage are grouped together. Answer choices are shuffled per session.'}};
const N5_QUIZ1_IDS=new Set(["n5exp001", "n5exp002", "n5exp003", "n5exp004", "n5exp005", "n5exp006", "n5exp007", "n5exp008", "n5exp009", "n5exp010", "n5exp011", "n5exp012", "n5exp013", "n5exp014", "n5exp015", "n5exp016", "n5exp017", "n5exp018", "n5exp019", "n5exp020", "n5exp021", "n5exp022", "n5exp023", "n5exp024", "n5exp025", "n5exp026", "n5exp027", "n5exp028", "n5exp029", "n5exp030", "n5exp031", "n5exp032", "n5exp033", "n5exp034", "n5exp035", "n5exp036", "n5exp037", "n5exp038", "n5exp039", "n5exp040", "n5exp041", "n5exp042", "n5exp043", "n5exp044", "n5exp045", "n5exp046", "n5exp047", "n5exp048", "n5exp049", "n5exp050"]);const SUPABASE_URL='https://hrvhoplwsxsxncpghqog.supabase.co';const SUPABASE_KEY='sb_publishable_herpo750W68fnwkXU2NWrA_kjm1fymz';let pendingResult=null,saving=false,saved=false;let bank=[],items=[],pos=0,chosen=null,checked=false,correct=0,graded=0,written=0,startTime=0,clockHandle=null,sessionAnswers=[];const $=id=>document.getElementById(id),t=k=>I[$('lang').value][k]||k;const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function localize(){for(const [id,key] of Object.entries({intro:'intro',levelLabel:'level',typeLabel:'type',modeLabel:'mode',start:'start',audioNotice:'audio',check:'check',quit:'quit',tts:'play',showTranscript:'transcript',audioHelp:'audioHelp',resultTitle:'results',again:'again'}))$(id).textContent=t(key);for(const el of $('kind').options)el.textContent=t(el.value);for(const el of $('mode').options)el.textContent=t(el.value);$('quizLabel').textContent=t('quizLabel');$('quiz').options[0].textContent=t('freeQuiz');$('quiz').options[1].textContent=t('quizOne');$('next').textContent=pos===items.length-1?t('finish'):t('next');if(!$('runner').classList.contains('hidden'))render(false)}
$('lang').addEventListener('change',()=>{localStorage.setItem('kotoba-exam-lang',$('lang').value);localize()});$('lang').value=localStorage.getItem('kotoba-exam-lang')||'id';
async function load(){try{const r=await fetch('./exam_question_bank.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.questions))throw Error('Invalid question bank');bank=d.questions; $('setupError').textContent='';}catch(e){$('setupError').textContent='Question bank unavailable: '+e.message;$('start').disabled=true}};
function updateQuizChooser(){const isN5=$('level').value==='N5';$('quizChooser').classList.toggle('hidden',!isN5);if(!isN5)$('quiz').value='free';$('kind').disabled=isN5&&$('quiz').value==='n5-1';if($('kind').disabled)$('kind').value='all'}$('level').addEventListener('change',updateQuizChooser);$('quiz').addEventListener('change',updateQuizChooser);function start(){const name=$('studentName').value.trim();if(!name){$('setupError').textContent='Enter your name / Masukkan nama siswa.';return}sessionStorage.setItem('kotoba-exam-student-name',name);const level=$('level').value,kind=$('kind').value,mode=$('mode').value;items=bank.filter(q=>q.level===level&&(kind==='all'||q.type===kind)&&(mode==='study'||q.type!=='listening'||Boolean(q.audio_url)));if(level==='N5'&&$('quiz').value==='n5-1')items=items.filter(q=>N5_QUIZ1_IDS.has(q.id));if(mode==='exam')items=items.filter(q=>q.type!=='writing');let groups=new Map();for(const q of shuffle(items)){let k=q.passage?'passage:'+q.passage:'single:'+q.id;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(q)}items=[...groups.values()].flat().map(q=>({...q,shuffled:q.options?shuffle(q.options.map((label,i)=>({label,i}))):[]}));if(!items.length){$('setupError').textContent=t('none');return}$('setupError').textContent='';pos=0;chosen=null;checked=false;correct=0;graded=0;written=0;sessionAnswers=[];startTime=Date.now();$('setup').classList.add('hidden');$('results').classList.add('hidden');$('runner').classList.remove('hidden');clearInterval(clockHandle);clockHandle=setInterval(()=>{$('clock').textContent=Math.floor((Date.now()-startTime)/60000)+':'+String(Math.floor((Date.now()-startTime)/1000)%60).padStart(2,'0')},1000);render(true)}
function render(reset){if(reset){chosen=null;checked=false}let q=items[pos];if(!q)return;$('progress').textContent=`${t('question')} ${pos+1} / ${items.length} · ${q.level} · ${t(q.type)}`;$('question').textContent=q.prompt;$('passage').classList.toggle('hidden',!q.passage);$('passage').textContent=q.passage||'';$('audio').classList.toggle('hidden',q.type!=='listening');$('transcript').classList.add('hidden');$('transcript').textContent=q.audio_script||'';let hasAudio=Boolean(q.audio_url);$('player').classList.toggle('hidden',!hasAudio);if(hasAudio)$('player').src=q.audio_url;else $('player').removeAttribute('src');$('tts').classList.toggle('hidden',hasAudio||$('mode').value!=='study');$('showTranscript').classList.toggle('hidden',$('mode').value!=='study');$('answers').replaceChildren();if(q.type==='writing'){let area=document.createElement('textarea');area.id='writingAnswer';area.placeholder=t('writingHint');area.value=chosen||'';area.addEventListener('input',()=>chosen=area.value);$('answers').append(area)}else for(let [i,opt] of q.shuffled.entries()){let btn=document.createElement('button');btn.className='choice'+(chosen===opt.i?' selected':'');btn.textContent=String.fromCharCode(65+i)+'. '+opt.label;btn.disabled=checked;btn.onclick=()=>{chosen=opt.i;render(false)};if(checked){if(opt.i===q.answer)btn.classList.add('correct');else if(chosen===opt.i)btn.classList.add('wrong')}$('answers').append(btn)}$('feedback').classList.toggle('hidden',!checked);if(checked){$('feedback').replaceChildren();let h=document.createElement('strong');h.textContent=q.type==='writing'?t('sample'):(chosen===q.answer?t('correct'):t('incorrect'));$('feedback').append(h);let p=document.createElement('p');p.textContent=q.explanation[$('lang').value];$('feedback').append(p);if(q.type==='writing'){let sample=document.createElement('div');sample.className='writing';sample.textContent=q.sample_answer;$('feedback').append(sample)}}$('check').disabled=checked;$('next').disabled=!checked;$('next').textContent=pos===items.length-1?t('finish'):t('next')}
function check(){let q=items[pos];if(q.type!=='writing'&&chosen===null){alert(t('needAnswer'));return}if(q.type==='writing'){written++}else{graded++;if(chosen===q.answer)correct++}sessionAnswers.push({q,chosen});checked=true;render(false)}
function next(){if(pos+1<items.length){pos++;render(true)}else finish()}
async function saveExamResult(){if(!pendingResult||saving||saved)return;saving=true;$('saveStatus').textContent='Saving / Menyimpan...';$('retrySave').classList.add('hidden');try{let r=await fetch(SUPABASE_URL+'/functions/v1/submit-quiz-result',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(pendingResult)});let d=await r.json().catch(()=>({}));if(!r.ok||d.success!==true)throw Error(d.error||'HTTP '+r.status);saved=true;$('saveStatus').textContent='✓ Saved to monitoring / Tersimpan di monitoring';}catch(e){console.error(e);$('saveStatus').textContent='Save failed / Gagal menyimpan: '+e.message;$('retrySave').classList.remove('hidden')}finally{saving=false}}
function finish(){clearInterval(clockHandle);if('speechSynthesis'in window)speechSynthesis.cancel();$('runner').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`${t('score')}: ${correct} / ${graded} · ${t('ungraded')}: ${written}`;pendingResult={student_name:$('studentName').value.trim(),quiz_id:($('level').value+'-'+($('level').value==='N5'&&$('quiz').value==='n5-1'?'quiz-1':$('kind').value)+'-'+$('mode').value).toLowerCase(),quiz_title:($('level').value+' '+($('level').value==='N5'&&$('quiz').value==='n5-1'?'Quiz 1':$('kind').value+' Practice')+' '+$('mode').value),level:$('level').value,quiz_type:$('level').value.startsWith('JFT_')?'jft':'jlpt',exam_level:$('level').value.startsWith('JFT_')?$('level').value.slice(4):$('level').value,score:correct,total_questions:graded,duration_seconds:Math.max(0,Math.floor((Date.now()-startTime)/1000)),answers:sessionAnswers.map(a=>({question_id:a.q.id,selected:a.chosen,type:a.q.type}))};saved=false;if(graded>0){saveExamResult()}else{$('saveStatus').textContent='Writing practice requires teacher review; no automatic score was saved.'}$('review').replaceChildren();for(const {q,chosen} of sessionAnswers){let p=document.createElement('p');p.textContent=(q.type==='writing'?'✎ ':chosen===q.answer?'✓ ':'✗ ')+q.prompt+' — '+q.explanation[$('lang').value];$('review').append(p)}}
$('studentName').value=sessionStorage.getItem('kotoba-exam-student-name')||'';$('retrySave').onclick=saveExamResult;$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('quit').onclick=()=>{clearInterval(clockHandle);if('speechSynthesis'in window)speechSynthesis.cancel();$('runner').classList.add('hidden');$('setup').classList.remove('hidden')};$('again').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden')};$('showTranscript').onclick=()=>$('transcript').classList.toggle('hidden');$('tts').onclick=()=>{let q=items[pos];if(!('speechSynthesis'in window)){alert(t('voiceUnavailable'));return}let voices=speechSynthesis.getVoices(),ja=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(!ja){alert(t('voiceUnavailable'));return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.audio_script||'');u.lang='ja-JP';u.voice=ja;u.rate=.9;speechSynthesis.speak(u)};localize();updateQuizChooser();load();
</script></body></html>
