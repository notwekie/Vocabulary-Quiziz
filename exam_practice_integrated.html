function finish(){clearInterval(clockHandle);if('speechSynthesis'in window)speechSynthesis.cancel();$('runner').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`${t('score')}: ${correct} / ${graded} · ${t('ungraded')}: ${written}`;const selectedQuiz=/^(?:n[1-5]|jfta[12])-(\d+)$/.exec($('quiz').value);const quizNo=selectedQuiz?Number(selectedQuiz[1]):null;const quizLevel=$('level').value;const quizDescriptor=quizNo!==null?'quiz-'+quizNo:$('kind').value;pendingResult={student_name:$('studentName').value.trim(),quiz_id:(quizLevel+'-'+quizDescriptor+'-'+$('mode').value).toLowerCase(),quiz_title:quizLevel+' '+(quizNo!==null?'Quiz '+quizNo:$('kind').value+' Practice')+' '+$('mode').value,level:quizLevel,quiz_type:quizLevel.startsWith('JFT_')?'jft':'jlpt',exam_level:quizLevel.startsWith('JFT_')?quizLevel.slice(4):quizLevel,score:correct,total_questions:graded,duration_seconds:Math.max(0,Math.floor((Date.now()-startTime)/1000)),answers:sessionAnswers.map(a=>({question_id:a.q.id,selected:a.chosen,type:a.q.type}))};saved=false;if(graded>0){saveExamResult()}else{$('saveStatus').textContent='Writing practice requires teacher review; no automatic score was saved.'}$('review').replaceChildren();for(const {q,chosen} of sessionAnswers){let p=document.createElement('p');p.textContent=(q.type==='writing'?'✎ ':chosen===q.answer?'✓ ':'✗ ')+q.prompt+' — '+q.explanation[$('lang').value];$('review').append(p)}}
$('studentName').value=sessionStorage.getItem('kotoba-exam-student-name')||'';$('retrySave').onclick=saveExamResult;$('start').onclick=start;$('check').onclick=check;$('next').onclick=next;$('quit').onclick=()=>{clearInterval(clockHandle);if('speechSynthesis'in window)speechSynthesis.cancel();$('runner').classList.add('hidden');$('setup').classList.remove('hidden')};$('again').onclick=()=>{$('results').classList.add('hidden');$('setup').classList.remove('hidden')};$('showTranscript').onclick=()=>$('transcript').classList.toggle('hidden');$('tts').onclick=()=>{let q=items[pos];if(!('speechSynthesis'in window)){alert(t('voiceUnavailable'));return}let voices=speechSynthesis.getVoices(),ja=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(!ja){alert(t('voiceUnavailable'));return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.audio_script||'');u.lang='ja-JP';u.voice=ja;u.rate=.9;speechSynthesis.speak(u)};localize();updateQuizChooser();load();
</script>
<script>
(function () {
  const KEY = 'kotoba-theme';
  const allowed = ['sakura','matcha','sumi'];
  const picker = document.getElementById('kotoba-theme-picker');
  function apply(value) {
    const theme = allowed.includes(value) ? value : 'sakura';
    document.body.setAttribute('data-theme', theme);
    if (picker) picker.value = theme;
    const admin = document.getElementById('theme-selector');
    if (admin) admin.value = theme;
    try { localStorage.setItem(KEY,theme); } catch (_) {}
  }
  const stored = (function(){try{return localStorage.getItem(KEY)}catch(_){return null}})();
  apply(stored);
  if (picker) picker.addEventListener('change', function(){apply(this.value)});
  window.addEventListener('storage',function(e){if(e.key===KEY)apply(e.newValue)});
  window.kotobaSetTheme = apply;
})();
</script>
