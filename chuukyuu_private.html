<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chūkyū I · Private Library</title><style>
:root{font-family:system-ui,sans-serif;color:#302b27;background:#f2eee6}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(100%,460px);background:#fffdf8;border:1px solid #ded6ca;border-radius:18px;padding:28px;box-shadow:0 8px 26px #302b2712}h1{font-size:1.55rem}p{line-height:1.6;color:#655c54}label{display:block;font-weight:650;margin:14px 0 6px}input{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #b8ada1;box-sizing:border-box;font-size:1rem}button{background:#51483f;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}a{color:#51483f}#message{min-height:24px} .hide{display:none}</style></head><body><main class="card"><a href="./index.html">← Kotoba Quiz Master</a><h1>🔒 Minna no Nihongo Chūkyū I</h1><p>Perpustakaan belajar privat. Masuk dengan akun siswa yang sudah disetujui admin.</p><form id="login"><label for="email">Email siswa</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Masuk</button></form><div id="member" class="hide"><p id="welcome"></p><p>✅ Akun Anda disetujui. Materi belajar sedang disiapkan di penyimpanan privat; belum tersedia untuk dibuka.</p><button id="logout">Keluar</button></div><p id="message" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const client=window.supabase.createClient('https://hrvhoplwsxsxncpghqog.supabase.co','sb_publishable_herpo750W68fnwkXU2NWrA_kjm1fymz');const msg=document.getElementById('message');const form=document.getElementById('login');const member=document.getElementById('member');const submit=document.getElementById('submit');async function check(){const {data:{user},error}=await client.auth.getUser();if(error||!user){form.classList.remove('hide');member.classList.add('hide');return}const {data,error:membershipError}=await client.from('kotoba_library_members').select('approved').eq('user_id',user.id).maybeSingle();if(membershipError){msg.textContent='Gagal memeriksa izin: '+membershipError.message;return}if(data?.approved===true){form.classList.add('hide');member.classList.remove('hide');document.getElementById('welcome').textContent='Masuk sebagai '+(user.email||'siswa');msg.textContent=''}else{form.classList.remove('hide');member.classList.add('hide');msg.textContent='Akun ini belum disetujui admin untuk mengakses Chūkyū I.'}}
form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;msg.textContent='Memeriksa akun...';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('password').value='';submit.disabled=false;if(error){msg.textContent='Login gagal: '+error.message;return}await check()});document.getElementById('logout').addEventListener('click',async()=>{await client.auth.signOut();msg.textContent='Anda telah keluar.';await check()});check();
</script></body></html>
